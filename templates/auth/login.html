{% extends "base.html" %}

{% block title %}Sign In | Hommy Cottage{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-12">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <a href="{{ url_for('main.index') }}" class="d-inline-block mb-3" title="Hommy Cottage Home">
                        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Hommy Cottage Logo" class="hc-auth-logo">
                    </a>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to manage your bookings and cottage listings</p>
                </div>

                <form action="{{ url_for('auth.login', next=next) }}" method="POST">
                    <div class="mb-3">
                        <label for="login-email" class="form-label small fw-bold text-muted">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" name="email" id="login-email" value="{{ email or '' }}" class="form-control border-start-0 ps-0" placeholder="name@example.com" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="login-password" class="form-label small fw-bold text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-secondary"></i></span>
                            <input type="password" name="password" id="login-password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-hc-primary w-100 py-2 rounded-pill fw-bold fs-6 shadow-sm mb-3" id="btn-login-submit">
                        Sign In
                    </button>
                </form>

                <!-- Quick Demo Access Helper -->
                <div class="p-3 bg-light rounded-3 border text-center mb-3">
                    <div class="small fw-semibold text-secondary mb-2" style="font-size: 0.82rem;">
                        <i class="bi bi-key-fill text-muted me-1"></i> Quick Demo Access (Click to Fill)
                    </div>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 small fw-semibold" onclick="fillDemo('admin@hommycottage.com', 'password123')">
                            <i class="bi bi-shield-lock me-1 text-danger"></i> Admin
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 small fw-semibold" onclick="fillDemo('host@hommycottage.com', 'password123')">
                            <i class="bi bi-house-door me-1 text-success"></i> Host
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 small fw-semibold" onclick="fillDemo('guest@hommycottage.com', 'password123')">
                            <i class="bi bi-person me-1 text-primary"></i> Guest
                        </button>
                    </div>
                </div>

                <div class="text-center small text-muted">
                    Don't have an account yet? 
                    <a href="{{ url_for('auth.register') }}" class="fw-bold text-success">Create account</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pwd) {
    document.getElementById('login-email').value = email;
    document.getElementById('login-password').value = pwd;
}
</script>
{% endblock %}
