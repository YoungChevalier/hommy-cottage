{% extends "base.html" %}

{% block title %}Access Denied (403) | Hommy Cottage{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-12">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="stat-icon mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2.2rem; background: rgba(234, 179, 8, 0.1); color: #ca8a04;">
                    <i class="bi bi-shield-slash-fill"></i>
                </div>
                <h1 class="fw-bold text-dark mb-2">403 - Access Forbidden</h1>
                <p class="text-muted small mb-4">
                    You do not have the necessary role or permissions to access this restricted section.
                </p>
                <div>
                    <a href="{{ url_for('main.index') }}" class="btn btn-hc-primary rounded-pill px-4 py-2 fw-semibold">
                        <i class="bi bi-house-door-fill me-1"></i> Return to Homepage
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
